<!DOCTYPE html>
<html>
<head lang="uk">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy List - Домашнє 1</title>
    <link rel="stylesheet" href="main.css">
    <script src="main.js" defer></script>
</head>
<body>
    <main class="container">
        <section class="buy-list">
            <div class="add-item-bar">
                <input type="text" placeholder="Назва товару" class="item-input" id="new-item-input">
                <button class="btn-add" id="add-btn" data-tooltip="Додати товар">Додати</button>
            </div>
            <div class="items-container" id="shopping-list"></div>
        </section>

        <aside class="summary">
            <div class="summary-card">
                <h2>Залишилося</h2>
                <div class="summary-tags" id="unbought-stats"></div>
            </div>
            <div class="summary-card">
                <h2>Куплено</h2>
                <div class="summary-tags" id="bought-stats"></div>
            </div>
        </aside>
    </main>

    <div class="badge">
        <span class="badge-title">Buy List</span>
        <span class="badge-author">Created by:<br>Олександра</span>
    </div>
</body>
</html>
